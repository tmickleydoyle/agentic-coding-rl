[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-coding-rl"
version = "0.1.0"
description = "Incremental RL environment toward a Composer-2.5-class agentic coding model"
requires-python = ">=3.10"
# Core deps are intentionally light so the sandbox + reward + task code runs
# locally (CPU/Mac) without pulling CUDA-only packages. GPU training deps live
# in the [gpu] extra and are installed on the RunPod box only.
dependencies = [
    "datasets>=2.18.0,<4.0",
]

[project.optional-dependencies]
# Installed on the RunPod GPU box (rungs 1-2). Pinned to a coherent CUDA-12.4 stack:
# unbounded ranges resolved to bleeding-edge (torch cu130 / trl 1.x) that broke on the
# pod driver and the trainer API. torch is the cu124 build from the pytorch index --
# install via: pip install -e ".[gpu]" --extra-index-url https://download.pytorch.org/whl/cu124
gpu = [
    "torch==2.5.1",
    "transformers==4.49.0",
    "trl==0.16.1",
    "peft==0.14.0",
    "vllm==0.7.2",
    "accelerate==1.3.0",
    "pyyaml>=6.0",
    # QLoRA (4-bit) SFT for the Qwen3.6-27B run. Only needed for QUANT=4bit; bf16 LoRA needs
    # nothing beyond peft. NOTE: qwen3_6 needs a NEWER stack than the rung-1 pins above —
    # vllm>=0.19.0 + latest transformers (the pinned 4.49/0.7.2 do NOT support qwen3_6). That
    # stack is installed at pod-setup, not from these pins; match bitsandbytes to it.
    "bitsandbytes>=0.43.0",
]
# Optional Claude-Haiku judge reward (rung-1 plumbing smoke test only).
judge = [
    "anthropic>=0.39.0",
]
# Optional live training metrics (--wandb). Needs WANDB_API_KEY exported on the box.
wandb = [
    "wandb>=0.18",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["acrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
